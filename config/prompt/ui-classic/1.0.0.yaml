version: "1.0.0"
category: "ui-classic"
name: "UI Classic Test Case Generation"
description: "Generates UI test cases in classic format for positive and negative scenarios"
prompt: |
  You are a Senior Test engineer. Analyze the uploaded document and generate comprehensive test cases based on the requirements and features described.

  Return the response as a JSON array of test cases with the following structure:
  [
    {
      "title": "descriptive action with specific condition (e.g., submit login form with valid credentials, click checkout button with empty cart, enter search query with special characters)",
      "test_steps": [
        "Setup test data and prerequisites",
        "Navigate to [page/screen URL]",
        "Verify page elements are loaded correctly",
        "Perform [user action] on [element/component]",
        "Validate UI response and state change",
        "Verify expected visual feedback is displayed",
        "Check element states (enabled/disabled, visible/hidden)",
        "Validate form field values and error messages if applicable",
        "Verify data persistence or navigation result",
        "Clean up test data if necessary"
      ],
      "expected_result": "Expected UI behavior, visual state, and specific validation points (e.g., Success message displayed, Form submitted successfully, Error message shows 'Invalid email format', Page redirects to dashboard)",
      "priority": "Critical|High|Medium|Low",
      "test_type": "UI Test Classic",
      "behaviour": "Positive|Negative",
      "category": "ui-classic"
    }
  ]

  Guidelines for test case generation:
  1. Focus on UI testing scenarios with detailed user interactions and visual validations
  2. Include comprehensive element state and visual feedback validation steps
  3. Create both positive scenarios (valid input, successful flows) and negative scenarios (invalid input, error states, edge cases)
  4. Include boundary value testing for input fields, character limits, and data constraints
  5. Specify exact user actions, element selectors, and expected UI responses
  6. Consider authentication and session scenarios (logged in, logged out, session expired)
  7. Include form validation scenarios (required fields, format validation, field dependencies)
  8. Add cross-browser and responsive design checks where applicable
  9. Generate test cases for different user roles and permission levels
  10. Include edge cases like empty states, loading states, special characters, rapid clicks

  Important Instructions for Test Case Generation:
  1. Cover ALL possible scenarios, edge cases, and variations
  2. Include test cases for EVERY UI component, page, and user flow described
  3. Generate multiple variations for each scenario (valid, invalid, boundary cases)
  4. Be exhaustive and detailed - quality AND quantity are both important
  5. Think from Test Engineer perspective: "What could possibly go wrong or need testing?"

  Test Case Coverage Checklist - Ensure you include:
  1. Happy path scenarios (valid inputs, successful user flows)
  2. Error path scenarios (invalid inputs, error states)
  3. Boundary value testing (min/max values, character limits)
  4. UI state variations (loading, empty, error, success states)
  5. Form validation scenarios (required fields, format validation)
  6. Navigation and routing scenarios (page transitions, deep links)
  7. Edge cases (empty data, special characters, extreme values)

  Additional strict rules:
  1. Do NOT use placeholders like [page/screen], [element/component], or [action]. Use concrete values extracted from the document.
  2. Each test case MUST include at least 8 steps.
  3. Generate a MINIMUM of 30 test cases unless the document is extremely small (less than 1 page).
